<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vino artesanal y sabores frutales de Duende vago">
  <title>Duende vago | Vino artesanal</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js?v=10" defer></script>
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <div class="brand-logo" aria-label="Logo Duende Vago">
        <img src="public/WhatsApp%20Image%202026-09-02%20at%2010.09.42%20PM.jpeg" alt="Logo Duende Vago, vino artesanal">
        <div class="brand-copy">
          <h1>Duende vago</h1>
          <p>Vino artesanal</p>
        </div>
      </div>
      <div class="header-carousel" aria-label="Fotos del producto">
        <img id="carousel-image" src="public/1.jpeg" alt="Foto del vino Duende vago">
      </div>
    </header>

    <nav class="category-nav" aria-label="Categorías de productos">
      <button class="category-button active" type="button" data-category="Mora">Mora</button>
      <button class="category-button" type="button" data-category="Piña">Piña</button>
      <button class="category-button" type="button" data-category="Araza">Araza</button>
      <button class="category-button" type="button" data-category="Naranjilla">Naranjilla</button>
      <button class="category-button" type="button" data-category="Combos">Combos</button>
    </nav>

    <section class="search-row" aria-label="Buscar productos">
      <span class="search-icon" aria-hidden="true"></span>
      <label class="sr-only" for="product-search">Buscar productos</label>
      <input id="product-search" type="search" placeholder="Buscar">
    </section>

    <section class="product-area" aria-labelledby="product-title">
      <article class="product-card">
        <div>
          <p class="product-eyebrow" id="product-eyebrow">Vino de mora</p>
          <h2 id="product-title">Mora</h2>
          <p id="product-description">El sabor que nunca pasa de moda.</p>
          <p id="product-detail">Suave, aromático e ideal para compartir.</p>
          <p id="product-price">Precio: $12.00</p>
        </div>
        <button class="add-button" id="add-button" type="button">Agregar al carrito.</button>
      </article>

      <div class="product-visual">
        <img class="product-image" id="product-image" src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/8-0HBjeal2pjQj6SwsBIHToVqKKUKWaW.jpeg" alt="Botella de Mora">
        <div class="combo-controls" id="combo-controls" aria-label="Carrusel de fotos de combos">
          <button id="combo-previous" type="button" aria-label="Foto de combo anterior">‹</button>
          <div id="combo-dots" aria-label="Elegir foto de combo"></div>
          <button id="combo-next" type="button" aria-label="Foto de combo siguiente">›</button>
        </div>
        <span class="visual-caption">Hecho lento · disfrutado sin prisa</span>
      </div>
    </section>

    <section class="video-section" aria-labelledby="video-title">
      <div class="video-heading">
        <p class="product-eyebrow">Conoce nuestro vino</p>
        <h2 id="video-title">Una forma distinta de celebrar</h2>
      </div>
      <div class="video-frame">
        <iframe
          width="560"
          height="315"
          src="https://www.youtube.com/embed/xOLTeFfn-_k?start=5"
          title="Video de Duende vago en YouTube"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
      </div>
      <a class="video-link" href="https://www.youtube.com/watch?v=xOLTeFfn-_k&amp;t=5s" target="_blank" rel="noopener noreferrer">Ver video en YouTube</a>
    </section>

    <footer class="browser-footer" aria-hidden="true">
      <span class="play-circle">▶</span>
      <span class="progress-line"></span>
      <span class="volume">◖</span>
    </footer>

    <a class="whatsapp-button" href="https://wa.me/59396207059?text=Hola%20Duende%20Vago%2C%20quiero%20hacer%20un%20pedido." target="_blank" rel="noopener noreferrer" aria-label="Hacer pedido por WhatsApp">
      <span class="whatsapp-icon" aria-hidden="true">&#9742;</span>
      <span>WhatsApp</span>
    </a>
  </main>
</body>
</html>
